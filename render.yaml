# Render Blueprint: creates the website + a free Postgres database.
# Render dashboard → New → Blueprint → pick this GitHub repo → enter an ACCESS_CODE → Apply.
services:
  - type: web
    name: technolounge-2026
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: TZ
        value: Asia/Manila
      - key: ACCESS_CODE
        sync: false # you type this in the Render dashboard; it is never stored in GitHub
      - key: DATABASE_URL
        fromDatabase:
          name: technolounge-db
          property: connectionString

databases:
  - name: technolounge-db
    plan: free
    region: singapore
